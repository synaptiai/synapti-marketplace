# Every question Flow asks a System One provider, and the confidence each
# answer needs before Flow acts on it. bin/flow-s1.sh reads this file; see
# references/system-one.md.
#
# One entry per decision point ("site"):
#
#   sites:
#     <site id>:                  lowercase words joined by dots
#       questions:                sent to the provider as YAML reads them
#         <question id>:          answers come back under the same id
#           type: noul | choice | score
#           instructions: ...     the judgment, complete in itself: the id is
#                                 not sent to the model. Text, an object or
#                                 a list
#           criteria: ...         choice: {option: description or null};
#                                 score: [level 0, level 1, ...];
#                                 noul (optional): {"true": ..., "false": ...}.
#                                 A description or a level is text, an
#                                 object or a list
#       thresholds:
#         <question id>:          every question needs one
#           default: 0.8          the confidence an answer must reach, 0..1
#           models:               per model version, keyed by the id the
#             jev-1.13.0: 0.75    provider's reply names
#
# YAML reads unquoted yes, no, on, off, ~, numbers and dates as other types.
# Quote them where text is meant: in ids, model ids, option names,
# instructions, descriptions, levels, and the noul keys "true" and "false".
# Flow refuses a file (questions-invalid) where one of those would not be sent
# as written, or where a value cannot be sent as JSON. Inside an object or a
# list, values are sent as YAML reads them, except what JSON has no form for
# (a key that is not a string, a date, a YAML ordered map or pairs), which is
# refused too.
#
# Confidence is the provider's own for a choice or a score; for a noul it is
# |2p - 1|, so p = 0.95 and p = 0.05 are equally confident. A threshold is set
# from measurements on the model version named, and a new version needs its own
# measurement before its entry is added.
#
# No decision point uses System One yet: each is added with the change that
# wires it in.

sites:
  classify.serves-issue:
    questions:
      serves_issue:
        type: noul
        instructions: >-
          The state is a GitHub issue (`issue.title`, `issue.body`) and one
          changed file in the working tree (`file.path`, `file.status`,
          `file.diff`), with the classification signals that matched it
          (`signals`). Statement: this change to this file is needed for, or
          directly supports, the outcome the issue asks for. A test, fixture or
          documentation change for that outcome counts. Cleanup, formatting,
          or work toward a different outcome does not.
        criteria:
          "true": "the change serves the issue's objective"
          "false": "the change is unrelated to the issue's objective, or serves a different one"
    thresholds:
      serves_issue:
        # Provisional, for collecting shadow records only. Shadow records keep
        # every answer, below-threshold ones included, so this value does not
        # affect the data. It is replaced, with a models: entry for the
        # collecting model, from the written comparison of shadow records
        # with the choices users made.
        default: 0.6
