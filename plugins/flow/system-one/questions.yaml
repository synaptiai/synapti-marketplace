# Every question Flow asks a System One provider, and the confidence each
# answer needs before Flow acts on it. bin/flow-s1.sh reads this file; see
# references/system-one.md.
#
# One entry per decision point ("site"):
#
#   sites:
#     <site id>:                  lowercase words joined by dots
#       questions:                sent to the provider as YAML reads them
#         <question id>:          answers come back under the same id
#           type: noul | choice | score
#           instructions: ...     the judgment, complete in itself: the id is
#                                 not sent to the model. Text, an object or
#                                 a list
#           criteria: ...         choice: {option: description or null};
#                                 score: [level 0, level 1, ...];
#                                 noul (optional): {"true": ..., "false": ...}.
#                                 A description or a level is text, an
#                                 object or a list
#       thresholds:
#         <question id>:          every question needs one
#           default: 0.8          the confidence an answer must reach, 0..1
#           models:               per model version, keyed by the id the
#             jev-1.13.0: 0.75    provider's reply names
#
# YAML reads unquoted yes, no, on, off, ~, numbers and dates as other types.
# Quote them where text is meant: in ids, model ids, option names,
# instructions, descriptions, levels, and the noul keys "true" and "false".
# Flow refuses a file (questions-invalid) where one of those would not be sent
# as written, or where a value cannot be sent as JSON. Inside an object or a
# list, values are sent as YAML reads them, except what JSON has no form for
# (a key that is not a string, a date, a YAML ordered map or pairs), which is
# refused too.
#
# Confidence is the provider's own for a choice or a score; for a noul it is
# |2p - 1|, so p = 0.95 and p = 0.05 are equally confident. A threshold is set
# from measurements on the model version named, and a new version needs its own
# measurement before its entry is added.
#
# Each decision point is added with the change that wires it in.

sites:
  # /flow:learn Phase 1, Transcript Corrections: one call per candidate the
  # transcript miner found. The state is {"assistant_before": <the end of the
  # assistant turn before it, at most 300 characters>, "user_turn": <the
  # user turn>}. With the TypeSafe provider this text leaves the machine; with
  # custom, or imajev at an address off the machine, it goes to that server.
  learn.correction:
    questions:
      is_correction:
        type: noul
        instructions: >-
          The state is one turn a user typed in a coding session with an AI
          assistant (`user_turn`), and the end of the assistant's turn just
          before it (`assistant_before`, cut to at most 300 characters). Judge
          this statement: in `user_turn` the user is correcting the
          assistant's previous turn, meaning they say it did something wrong,
          did not do what was asked, reported something untrue, or should have
          done it differently. A new request, a question about the code, an
          answer to the assistant's question, approval, thanks, or a remark
          about timing is not a correction.
        criteria:
          "true": "the user is correcting what the assistant just did or said"
          "false": "the user is doing anything else: a new task, a question, an answer, approval, thanks, or a remark"
    thresholds:
      is_correction:
        # Provisional: the 2026-10-07 replay comparison for jev-1.13.0 had
        # too few labelled items to choose a value (references/system-one.md,
        # learn.correction). 0.8 means p >= 0.9 or p <= 0.1, and only on mode
        # uses it; shadow records keep every answer, below-threshold ones
        # included. The value to switch the site on with, and a models entry
        # for jev-1.13.0, come from a written comparison of shadow records
        # with the verdicts /flow:learn records.
        default: 0.8
