# Every question Flow asks a System One provider, and the confidence each
# answer needs before Flow acts on it. bin/flow-s1.sh reads this file; see
# references/system-one.md.
#
# One entry per decision point ("site"):
#
#   sites:
#     <site id>:                  lowercase words joined by dots
#       questions:                sent to the provider as YAML reads them
#         <question id>:          answers come back under the same id
#           type: noul | choice | score
#           instructions: ...     the judgment, complete in itself: the id is
#                                 not sent to the model. Text, an object or
#                                 a list
#           criteria: ...         choice: {option: description or null};
#                                 score: [level 0, level 1, ...];
#                                 noul (optional): {"true": ..., "false": ...}.
#                                 A description or a level is text, an
#                                 object or a list
#       thresholds:
#         <question id>:          every question needs one
#           default: 0.8          the confidence an answer must reach, 0..1
#           models:               per model version, keyed by the id the
#             jev-1.13.0: 0.75    provider's reply names
#
# YAML reads unquoted yes, no, on, off, ~, numbers and dates as other types.
# Quote them where text is meant: in ids, model ids, option names,
# instructions, descriptions, levels, and the noul keys "true" and "false".
# Flow refuses a file (questions-invalid) where one of those would not be sent
# as written, or where a value cannot be sent as JSON. Inside an object or a
# list, values are sent as YAML reads them, except what JSON has no form for
# (a key that is not a string, a date, a YAML ordered map or pairs), which is
# refused too.
#
# Confidence is the provider's own for a choice or a score; for a noul it is
# |2p - 1|, so p = 0.95 and p = 0.05 are equally confident. A threshold is set
# from measurements on the model version named, and a new version needs its own
# measurement before its entry is added.
#
# Each decision point is added with the change that wires it in, and ships off.

sites:
  # /flow:address Phase 2: the priority of one feedback item, asked after the
  # session has chosen its own. The block keeps the higher of the two (P1 > P2
  # > P3 > Question), so an answer can raise an item and never lower it.
  # State: {"comment": {"text", "path", "line"}}.
  address.category:
    questions:
      category:
        type: choice
        instructions: >-
          `comment.text` is one item of review feedback on a pull request,
          written by a reviewer about the file `comment.path` near line
          `comment.line` (either may be empty). Which category does the
          concern it raises belong to? Judge the concern itself, not how
          politely or tentatively it is worded.
        criteria:
          "P1": "Must fix: a bug, a security issue, a logic error, or data loss or exposure"
          "P2": "Should fix: a convention violation, a missing test, or unclear code"
          "P3": "Consider: a style preference or an optional optimization"
          "Question": "Asks for an explanation or a decision; no code change is requested"
    thresholds:
      category:
        # Provisional. With four options, 0.8 needs the chosen option at 0.85
        # or more ((4m - 1) / 3), so a raise acts only on a clear answer.
        # Shadow mode records the answer whether or not it clears this, so
        # the value loses no data; it is replaced by one chosen from the
        # shadow comparison and keyed to the model measured
        # (models: {jev-1.13.0: ...}).
        default: 0.8
  # /flow:address Phase 1: whether one inline review comment still applies to
  # the code at the place it refers to now. p is the probability that the
  # concern is still present, so a confident low p means already addressed.
  # State: {"comment": {"body", "path", "line", "original_line", "diff_hunk",
  # "outdated"}, "code_now": {"path", "head", "start", "end", "text"}}.
  address.still_applies:
    questions:
      concern_present:
        type: noul
        instructions: >-
          The state holds one pull-request review comment (`comment.body`, written
          against `comment.diff_hunk` at `comment.path`) and the code at that place
          now (`code_now.text`, lines `code_now.start` to `code_now.end` of
          `code_now.path` at commit `code_now.head`). Is the problem or request the
          comment describes still present in `code_now.text`? Answer false only
          when `code_now.text` shows the concern has been resolved. If the code
          shown is not enough to tell, answer true.
        criteria:
          "true": "the concern is still present in the code now, or the code shown cannot rule it out"
          "false": "the code now visibly resolves the concern the comment raises"
    thresholds:
      concern_present:
        # Provisional. Confidence is |2p - 1|, so 0.9 acts only on p <= 0.05
        # (addressed) or p >= 0.95 (applies). A wrong "addressed" leaves a
        # comment unfixed, so the bar is high; shadow mode records the answer
        # whether or not it clears this. It is replaced by the value the shadow
        # comparison chooses for the model measured (models: {jev-1.13.0: ...}).
        default: 0.9
