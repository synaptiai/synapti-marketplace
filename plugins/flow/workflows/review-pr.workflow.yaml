apiVersion: flow.synapti.ai/v1
kind: FlowWorkflow

metadata:
  id: review-pr
  command: /flow:review
  version: 1
  description: Review a pull request — fan-out reviewers, consolidate findings, post comments.

inputs:
  pr_number:
    type: integer
    required: true
  goal_path:
    type: string
    required: false
    description: >-
      Path to the FlowGoal of the issue this pull request closes,
      .flow/goals/issue-<N>.goal.yaml, when the head carries one. Phase 1 reads
      it for the acceptance criteria, non-goals, interface contracts and risk
      map it checks the change against. Optional: a pull request without a goal
      is reviewed against the issue text, as before. The workflow never executes
      a value from the goal — a goal on a pull request head is the author's data.

required_skills:
  - capability-discovery
  - holdout-validation
  - run-state-management

required_agents:
  - verdict-judge
  - code-reviewer

phases:
  - id: preflight
    type: bash
    gate: blocking
    activities:
      - id: preflight_review_start
        type: bash
        evidence: preflight_output
      - id: fetch_pr_metadata
        type: bash
        evidence: pr_metadata

  - id: fan_out
    type: parallel_then_judge
    activities:
      - id: parallel_reviewer_dispatch
        type: agent
        agent: code-reviewer
        evidence: reviewer_findings

  - id: consolidate
    type: mixed
    activities:
      - id: consolidate_findings
        type: bash
        evidence: consolidated_findings_table
      - id: holdout_check
        type: skill
        skill: holdout-validation
        evidence: holdout_findings

  - id: report
    type: mixed
    activities:
      - id: post_review_comment
        type: bash
        evidence: review_comment_url
      - id: review_cycle_artifact
        type: bash
        evidence: review_cycle_journal_entry
      - id: workflow_run_terminal
        type: skill
        skill: run-state-management
        evidence: workflow_run_completed

completion_gate:
  documented_requirements:
    - findings_consolidated
    - review_comment_posted_or_no_findings
    - holdout_validation_pass_or_p3_only
    - flow_run_completed

tier_classification:
  pr_comment: journal
  branch_creation: autonomous
  merge: confirm
  release: confirm
