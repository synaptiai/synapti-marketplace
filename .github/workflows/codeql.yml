name: "CodeQL"

# Advanced setup (replaces GitHub's CodeQL "default setup"), scanning this
# repository's own code.
#
# This previously checked out the `plugins/agent-capability-standard` git
# submodule so the python analysis had something to scan. The marketplace now
# fetches that plugin from its own repository (see
# `.claude-plugin/marketplace.json`), which runs its own CodeQL python analysis
# against its current code; scanning it from here only ever covered whatever
# commit the submodule pointer happened to sit on. The python analysis stays —
# it now scans this repository's own python, under `plugins/flow/`.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Default query suite — matches the prior default-setup config
          # (query_suite: default).

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
