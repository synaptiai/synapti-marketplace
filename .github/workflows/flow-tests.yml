name: Flow Plugin Tests

on:
  pull_request:
    paths:
      - 'plugins/flow/bin/**'
      - 'plugins/flow/hooks/**'
      - 'plugins/flow/commands/**'
      - 'plugins/flow/references/**'
      - 'plugins/flow/skills/**'
      - 'plugins/flow/tests/**'
      - 'tests/**'
      - '.github/workflows/flow-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'plugins/flow/bin/**'
      - 'plugins/flow/hooks/**'
      - 'plugins/flow/commands/**'
      - 'plugins/flow/references/**'
      - 'plugins/flow/skills/**'
      - 'plugins/flow/tests/**'
      - 'tests/**'
      - '.github/workflows/flow-tests.yml'

permissions:
  contents: read

jobs:
  test:
    # macOS is not decoration. Both published releases carry defects that only
    # appear there — a bash 3.2 parameter substitution that recorded nothing
    # (#179) and a logical-vs-physical path comparison under /var (#179 again).
    # Neither is visible on Linux, and every workflow ran on Linux only, so
    # both shipped. macOS also pins bash 3.2, which is the floor the plugins
    # claim to support.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python prerequisites
        # journal-record.test.sh and promote-proposal.test.sh exercise the
        # PyYAML-using helpers; validate-skill-input.test.sh exercises the
        # jsonschema fallback. The helper scripts themselves skip-PASS when
        # PyYAML is absent, but in CI we always want the strict path.
        #
        # Hardening notes:
        # - `python3 -m pip` guarantees the install targets the same
        #   interpreter the helpers will use (avoids the case where bare
        #   `pip` resolves to a different Python on the runner image).
        # - Versions come from plugins/flow/requirements.txt, the manifest an
        #   operator installs from, so CI and a real install can never be
        #   running different versions. Bump there, once.
        # - `--break-system-packages` is defensive against future runner
        #   images that enforce PEP 668 "externally-managed-environment"
        #   on the system Python (Ubuntu 24.04+). On current runners the
        #   flag is a no-op; on PEP 668 systems it preserves the same
        #   install path without requiring a venv setup step.
        run: |
          python3 --version
          python3 -m pip install --quiet --break-system-packages -r plugins/flow/requirements.txt

      - name: Verify test prerequisites
        run: |
          bash --version | head -1
          jq --version
          awk --version 2>/dev/null | head -1 || echo "awk: BSD/POSIX (no --version)"
          python3 -c "import yaml; print('PyYAML', yaml.__version__)"
          python3 -c "import jsonschema; print('jsonschema', jsonschema.__version__)"

      - name: Report the shell the suite will run under
        # macOS ships bash 3.2 as /bin/bash. Printing it makes a
        # bash-4-only construct's failure legible instead of mysterious.
        run: |
          /bin/bash --version | head -1
          echo "checkout root length: ${#GITHUB_WORKSPACE}"

      - name: Run flow tests
        run: plugins/flow/tests/run.sh

  root-tests:
    # The repository-root tests/ tree holds eleven standalone checks that no
    # workflow reached until issue #177. They are kept where they are and where
    # they were written; tests/run-all.sh discovers and runs them.
    #
    # Same two-OS matrix as the flow suite: these scripts are bash, and the
    # macOS runner pins bash 3.2, which is the floor the plugins claim.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python prerequisites
        # tests/journal-orchestration/test.sh exercises the PyYAML-backed
        # journal writer and its sys.path hardening, so PyYAML is a hard
        # prerequisite for this job, not an optional strict path. The Ubuntu
        # runner image happens to ship it and the macOS image does not, which is
        # why this job passed on one runner and failed on the other the first
        # time it ran. Installed from the plugin manifest so the version here is
        # the version the manifest declares.
        run: |
          python3 --version
          python3 -m pip install --quiet --break-system-packages -r plugins/flow/requirements.txt

      - name: Verify prerequisites
        run: |
          /bin/bash --version | head -1
          jq --version
          git --version
          python3 -c "import yaml; print('PyYAML', yaml.__version__)"

      - name: Run root tests
        run: tests/run-all.sh
