specification:
  non_goals:
  - The site stays off; no mode or threshold changes. Choosing a threshold for the
    alternative is not part of this issue.
  - The question stays a choice with option ids P1, P2, P3 and Question, so the block
    in /flow:address that ranks the answer is unchanged.
  - No new labelled items, and no ruling on whether a raise is right.
  - One alternative wording is measured; no wording is revised after seeing answers.
  failure_modes:
  - Fewer raises because fewer items were answered; raises are counted over all 200
    items and answered, no-answer and truncated counts are reported per form.
  - Drift since 2026-10-07; the current wording is run again in the same session and
    its agreement with the earlier answers is reported.
  - The label leaking into the state; an item whose text contains P1, P2 or P3 is
    refused before sending.
  - Replay records mixing with live records; the replay writes to its own state directory.
  - Running the plugin from inside the repository; the harness runs a copy outside
    it.
  interface_contracts:
  - Items are the 200 rows of evals/results-2026-10-07-address-s1/address-category.jsonl.
  - The block run is COMMENT_CATEGORY_BLOCK extracted unchanged from commands/address.md
    of the copy.
  - Records are matched to items by ref pr:<pr>/<kind>:<id>/<finding>.
  - Raise rule - confidence at or above the threshold and the chosen option ranks
    above the label (P1 > P2 > P3 > Question).
  risk_map:
  - area: Raise count
    plausible_wrong_version: counting raises over answered items only
    discriminating_check: 3 items, one unanswered and two raised -> 2 raises of 3
  - area: Raise rule
    plausible_wrong_version: using P(P1) instead of the answer confidence, or > instead
      of >=
    discriminating_check: confidence exactly 0.8 with a higher choice counts as a
      raise at 0.8
  - area: Which form was run
    plausible_wrong_version: the alternative run reading the current wording
    discriminating_check: summary checks the sent question block's sha256 equals the
      registered alternative's
  - area: P1 placed lower
    plausible_wrong_version: counting every lower answer, not only those on items
      labelled P1
    discriminating_check: a P2 item answered P3 does not count; a P1 item answered
      P2 does
