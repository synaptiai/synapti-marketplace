specification:
  non_goals:
  - Ledger citation for code-quality findings — pyscn output is normalized into an
    artifact only (no dossier-quality-evidence.sh, no new evidence-ledger Notes-tag
    vocabulary, no EV-#### rows, no G20). Confirmed via AskUserQuestion.
  - A single combined wrapper script — two separate scripts (dossier-scan-security.sh,
    dossier-scan-quality.sh), not one script with a --type flag.
  - Any change to G01–G19's existing logic, order, or precedence computation in dossier-gate.sh
    — only G19's inputs change, via the severity-extraction bug fix.
  - Live GitHub Actions execution as a completion requirement — AC6 is satisfied by
    a local run against actually-installed real tools, contrasted with a fake/stub
    binary, not by deploying and triggering the CI workflow.
  - Reimplementing CVSS scoring math — severity comes from osv-scanner's own precomputed
    groups[].max_severity field.
  - pyscn check's CI-oriented exit-code mode — check has no --json output at all;
    analyze --json is used exclusively.
  - Widening engagement.allowedActions beyond the two new flags (runSecurityScan,
    runCodeQualityScan).
  - Offline-vulnerability-database provisioning/refresh tooling — this issue defines
    the fail-closed contract only, not a scheduled downloader.
  failure_modes:
  - 'Timeouts: both wrapper scripts run their underlying tool under an explicit bounded
    timeout; a timeout reports a distinct did-not-complete status, never 0 findings.'
  - 'Partial failures: osv-scanner''s existing per-record fault isolation (unparseable_records)
    is preserved end-to-end; pyscn''s own warnings/errors arrays are surfaced, not
    discarded.'
  - 'Invalid input: a target path that does not exist, is not readable, or (quality
    scan) contains no Python files is reported as an explicit error, never a clean
    zero-issues result.'
  - 'Missing context: (a) capability disabled -> reports not-run/disabled, tool never
    invoked; (b) tool unavailable on PATH -> distinct tool-unavailable status, never
    0 findings; (c) stale/missing offline vulnerability DB -> unavailable/stale_advisory_data,
    fail-closed, never clean; (d) pyscn''s .pyscn/ report directory follows CWD not
    target path -> wrapper cds into a scratch dir and selects the report via before/after
    directory snapshot, never newest-file.'
  interface_contracts:
  - 'dossier-scan-security.sh (new): --target <path> [--out <dir>] [--offline]. Resolves
    dossier.engagement.allowedActions.runSecurityScan via bare dotted key with --default
    "false", no // fallback. Success = valid JSON on stdout, never exit-code==0 (osv-scanner
    exit 1 = vulnerabilities found = success; exit 127/128 = genuine failure with
    empty stdout). Feeds dossier-vuln-evidence.sh --scan <path>.'
  - 'dossier-vuln-evidence.sh severity-extraction fix (bug fix in scope): switch from
    vulnerabilities[].severity[0].score (a CVSS vector string in real output) to groups[].max_severity
    (a bare numeric CVSS string) for the osv-scanner shape. One evidence row per group
    (merges aliases); primary id = CVE- alias if present else lexicographically-first
    id. Resolved design decision: this flips previously-INCONCLUSIVE G19 evaluations
    to real Critical/High rows for existing installations — documented, not silent.'
  - evidence-ledger-schema.md:129 State=R rationale sentence revised to distinguish
    citing a pre-existing artifact (#136) from dossier having executed the scan itself
    (#137), both remaining State R.
  - 'dossier-scan-quality.sh (new): --target <path> [--out <dir>]. Resolves dossier.engagement.allowedActions.runCodeQualityScan
    independently of runSecurityScan, same bare-dotted-key pattern. cds into a scratch
    dir, invokes pyscn analyze --json <target>, selects report via directory snapshot
    diff. Parses both snake_case (dead_code section) and PascalCase (complexity section)
    keys in the same report. New artifact schema dossier.quality-scan/v1, no ledger
    citation.'
  - 'schema.json/settings.json: two new allowedActions booleans, runSecurityScan and
    runCodeQualityScan, both default false, following the existing runTests/runBuild
    pattern.'
  - 'enforce-allowed-actions.sh: two new deny-blocks for direct osv-scanner/pyscn
    invocation, following the existing RUN_TESTS/RUN_BUILD/NETWORK block structure
    and BOUND/WRAPPER anchoring.'
  - 'CI template (dossier-docs-refresh.yml): new job/step, sibling of the existing
    policy job — permissions contents:read only, no LLM credential, persist-credentials:false,
    pinned tool versions, output uploaded as an artifact for the refresh job''s agent
    to Read, never execute.'
