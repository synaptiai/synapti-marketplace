    verification_command: grep -n "http.extraheader" plugins/dossier/bin/dossier-rotation-check.sh
    must_pass: true
    status: pending
    evidence_ref: null
    last_evaluated_at: null
    last_result: null
  - id: AC4
    text: New test coverage in rotation-check.test.sh using a PATH-stub git wrapper
