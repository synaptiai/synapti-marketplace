specification:
  non_goals:
  - Not fixing dossier-package-check.sh's analogous "clean result, invisible scope"
    shape (CHECK_RESULT=CLEAN with CHECK_LINKS_CHECKED=0) — noted in the issue as
    related but explicitly out of scope for this fix.
  - Not changing the registration match algorithm itself (normalized literal-substring
    grep -qF against the approved-wording pool) — only which lines are fed into it.
  - Not adding fuzzy/semantic matching for claims.
  - Not changing the claim register file format or the Required Qualifications section
    handling.
  - Not touching frontmatter/header skip logic (IN_HEADER, lines 219-237) — that is
    a separate, correct mechanism.
  failure_modes:
  - 'Timeouts: none — synchronous, local, single-pass text scan with no network or
    long-running I/O.'
  - 'Partial failures: n/a — the script processes one file at a time in a loop and
    a parse failure on one line must not abort the whole file (existing continue-based
    control flow preserved).'
  - 'Invalid input: a malformed table row (unbalanced |) must not crash the script;
    worst case is an extra/missing empty cell, not a non-zero exit from a parse error.'
  - 'Missing context: if the claim register file is absent or empty (REGISTER_PRESENT=0),
    existing behavior is unchanged; this fix only changes what counts as a candidate
    sentence.'
  interface_contracts:
  - 'CLI contract unchanged: dossier-claim-scan.sh [--file <path>] [--json] [--output-root
    <dir>], exit codes unchanged (0 clean / 1 findings / 2 leak / 3 missing dir).'
  - Plain-text summary output gains one new additive line reporting the examined line
    classes, without removing or reordering the four existing CLAIM_SCAN_* lines.
  - --json output object gains one new additive key reporting the examined line classes,
    without changing existing keys.
  - unregistered hit rows keep their existing tab-separated shape for hits found in
    bullets/blockquotes/table-cells.
  risk_map:
  - area: table row splitting
    plausible_wrong_version: splits on every | without skipping the header/separator
      row, so header and --- rows themselves get scored as candidate sentences
    discriminating_check: 'fixture table with header/separator rows and no matching
      register row → right: 0 unregistered hits from header/separator; wrong: header
      row flagged as an unregistered claim'
  - area: bullet marker stripping
    plausible_wrong_version: strips only "- " but not "* ", or leaves a leading space
      that defeats the word-floor/normalize trim
    discriminating_check: 'bullet using "* " marker with an unregistered declarative
      claim → right: examined and flagged; wrong: still skipped'
  - area: line-class exemption boundary
    plausible_wrong_version: widening the selector accidentally treats fenced-code
      content or heading text as candidate prose
    discriminating_check: 'heading and fenced code block both containing the same
      claim text → right: 0 hits from both; wrong: heading or fence content flagged'
  - area: blockquote handling
    plausible_wrong_version: multi-line blockquotes get concatenated or truncated,
      corrupting the sentence before normalization
    discriminating_check: 'two-line blockquote → right: each line evaluated per the
      existing per-line loop; wrong: script errors or silently drops a line'
  - area: new summary field placement
    plausible_wrong_version: the new field reflects only what happened to appear in
      this one file's run rather than the scanner's actual capability
    discriminating_check: 'paragraph-only fixture with no bullets/tables → right:
      field still lists all classes the scanner is capable of examining; wrong: field
      omits classes absent from this file'
