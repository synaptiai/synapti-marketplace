objective:
  outcome: 'Issue #295 is implemented and verified.'
  source:
    type: github_issue
    number: 295
    title: 'feat(flow): System One asks about the items of one goal stop or one review
      in fewer requests'
  acceptance_criteria:
  - id: AC1
    text: On the same input, a goal stop and a review.confidence pass make fewer requests
      than one per item; an item too large to share a request is still asked on its
      own. The time per request and the timeouts at the shipped timeout are reported.
    verification_command: plugins/flow/tests/run.sh e2e-s1-batch.test.sh && python3
      plugins/flow/evals/results-2026-10-12-s1-batch/summarize.py --check ac1
    must_pass: true
    status: pass
    evidence_ref: .flow/runs/2026-10-12T061533Z-issue-295/evidence/goal-issue-295-ac1-104031.evidence.yaml
    last_evaluated_at: '2026-10-12T10:50:09Z'
    last_result: pass
  - id: AC2
    text: On a recorded set of goal criteria and review findings, the answers given
      together agree with the answers given alone at a rate set before the comparison
      runs, measured against how much two sends of the same item alone disagree; the
      comparison is reported, and asking together becomes the default only if it meets
      that rate.
    verification_command: python3 plugins/flow/evals/results-2026-10-12-s1-batch/summarize.py
      --check ac2
    must_pass: true
    status: pass
    evidence_ref: .flow/runs/2026-10-12T061533Z-issue-295/evidence/goal-issue-295-ac2-104340.evidence.yaml
    last_evaluated_at: '2026-10-12T10:50:09Z'
    last_result: pass
  - id: AC3
    text: A failure of the whole request gives every item in it no answer, as a failed
      call does today; a missing, abstained, malformed or below-threshold answer affects
      only its own item.
    verification_command: plugins/flow/tests/run.sh e2e-s1-batch.test.sh
    must_pass: true
    status: pass
    evidence_ref: .flow/runs/2026-10-12T061533Z-issue-295/evidence/goal-issue-295-ac3-104341.evidence.yaml
    last_evaluated_at: '2026-10-12T10:50:09Z'
    last_result: pass
  - id: AC4
    text: review.challenge, review.dedup and the /flow:address questions keep one
      request per item, and the System One reference says why.
    verification_command: plugins/flow/tests/run.sh e2e-s1-batch.test.sh && python3
      plugins/flow/evals/results-2026-10-12-s1-batch/summarize.py --check ac4
    must_pass: true
    status: pass
    evidence_ref: .flow/runs/2026-10-12T061533Z-issue-295/evidence/goal-issue-295-ac4-104649.evidence.yaml
    last_evaluated_at: '2026-10-12T10:50:09Z'
    last_result: pass
specification:
  non_goals:
  - review.challenge, review.dedup, the two /flow:address questions, learn.correction,
    classify.serves-issue and quality.tests-ran keep one request per item.
  - 'No two decision points share a request: each request belongs to one site, with
    that site''s mode and threshold.'
  - No mode or threshold changes; every site stays off by default.
  - The question wording changes only by the words that point it at its item; no other
    rewording.
  - 'A batched state is never shortened: an item that does not fit goes on today''s
    single path.'
  - No work for Python 3.9.
  failure_modes:
  - 'Timeouts: a request that times out gives every item in it timeout, and each caller
    does what it does today for a failed call (goal: Haiku decides the turn; review:
    no demotion, and two such requests in a row stop asking).'
  - 'Partial failures: a missing, abstained, malformed or below-threshold answer affects
    only its own item; the other items keep their answers.'
  - 'Invalid input: an item whose state cannot be read or sent as JSON is refused
    alone (state-invalid) and the rest are asked; a bad items file is a usage error
    (exit 2).'
  - 'Missing context: no provider, mode off, or batching off gives today''s behaviour:
    one request per item, or none.'
  interface_contracts:
  - 'flow-s1.sh ask-many --site S --items-file F [--run-id ID]. F: {"items": [{"key",
    "state_file", "current", "ref"}]}. Stdout: one JSON line per item, in input order:
    {key, result, answer|null, model, truncated, batch}.'
  - 'Two layouts, chosen by the user setting systemOne.batch (off | items-in-state
    | items-in-questions; user settings and the plugin default only), whose default
    is set by the measurement. items-in-state: state {"items": {key: item state}},
    one question per item whose instructions start "This question is about `items.<key>`
    only ..." followed by the site''s instructions. items-in-questions: state {"items":
    [keys]}, each question''s instructions an object {question: <site instructions>,
    item: <item state>}.'
  - 'Packing: items in input order, at most 10 per request, total under the client''s
    cap (stateTokenCap x 4 characters); an item over the cap on its own goes through
    ask as today.'
  - 'Records: one per item with today''s fields; question is the site''s question
    id; state_sha256 is the digest of the item''s state file; plus batch: {id, size,
    index, layout}.'
  risk_map:
  - area: Answer to item
    plausible_wrong_version: answers attached by position, not by key
    discriminating_check: items AC3, AC1 with stub p 0.9 for AC3 and 0.1 for AC1 ->
      right AC3=0.9, AC1=0.1; wrong swapped
  - area: Packing bound
    plausible_wrong_version: '> for >= at the cap, or 11 items in one request'
    discriminating_check: two items summing exactly to the cap -> 1 request, one character
      more -> 2; 11 small items -> 2 requests, wrong 1
  - area: Per-item fallback
    plausible_wrong_version: the first failure fails the whole batch
    discriminating_check: item 2 malformed of 3 -> right items 1 and 3 answered, 2
      malformed; wrong all three no answer
  - area: Record join
    plausible_wrong_version: the batch's digest written as state_sha256
    discriminating_check: right the record's digest equals sha256 of the item's state
      file; wrong the batch hash
  - area: Threshold lookup
    plausible_wrong_version: threshold keyed by the item key instead of the site question
    discriminating_check: goal.warn-evidence on jev-1.13.0 (threshold 0.6), p 0.79
      -> below-threshold, p 0.81 -> answered; wrong default 0.9 applied, or an error
