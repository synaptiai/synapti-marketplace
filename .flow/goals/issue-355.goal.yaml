    must_pass: true
    status: pending
    evidence_ref: null
  - id: G1
    text: 'P2 person_forms_denied is go: tier-gate refuses all person forms in a worker
      (paid run only after the user go-ahead).'
    verification_command: jq -e '.probes.P2.parts.person_forms_denied.result == "go"'
