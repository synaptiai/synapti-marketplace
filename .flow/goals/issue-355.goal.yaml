    verification_command: jq -e '.probes.P2.parts.stop_caps.result == "go"' docs/flow-factory/probes.json
    must_pass: true
    status: pending
    evidence_ref: null
  - id: G3
    text: 'P2 task_completed_refusals is go: TaskCompleted refuses at most 3 times
      per stage (B16 fallback only on a no-go).'
    verification_command: jq -e '.probes.P2.parts.task_completed_refusals.result ==
