    status: pending
    evidence_ref: null
  - id: C2
    text: Kill fields are kept when a later effect fails.
    verification_command: plugins/flow/tests/run.sh plugins/flow/tests/e2e-factory-engine-next.test.sh
    must_pass: true
    status: pending
    evidence_ref: null
specification:
  non_goals:
  - No change to `/flow:start` or any other command's issue read (1d).
  - 'No in-session confirm past tier-gate: in-session always-ask subcommands are still
    refused with `PERSON_CONFIRM_REQUIRED` until 1c''s heartbeat; no `executor_can_confirm`
    and no `confirm <intent>` items from `next` (1c).'
  - No push, `gh pr create`, PR body edit, PR adoption or PR record by the engine
    (1e, Q11). 1b only makes `rebuild` take head_sha from a `pushed` or `pr_recorded`
    events line.
  - No re-vouch by re-adding the queue label (Q3).
  - 'No P8 run: the triage role is shown with recorded permission fixtures only (Q2).'
  - No read guard on a worker's own `gh issue view` (design trust_and_untrusted_text
    L40).
  - 'No claim that comment commands are person-only: a comment posted with the person''s
    token counts as the person (design person_channels L59-L65).'
  - No change to flow behaviour outside a factory except the new `tiers.issueUpdate`
    key.
  - No fault-injection key in a shipped module.
  - No release and no version change (AC13).
  failure_modes:
  - '**Timeouts** — the intake judge''s run is ended by flow-judge.sh''s own `timeout`
    at the intake timeout (exit 124, no reply → stage_failed, one of the three runs);
    a judge that hangs past the launcher''s limit falls to the lease-expiry rows;
    a sync over its budget leaves later jobs waiting with no partial facts.'
  - '**Partial failures** — a POST that fails leaves the intent `recorded` and the
    next drain looks for its marker first, then retries; a POST that succeeds but
    whose record is lost is found by its marker; an effect that fails after `kill_current`
    keeps the kill fields (carry item 2); the process dying after a command''s `store_pending`
    or after rows 41/41e/41k is recovered on the next pass with one event applied.'
  - '**Invalid input** — an unparsable or schema-invalid judge reply is stage_failed;
    an edited outbox body, argv or hash refuses with `INTENT_CHANGED` (exit 3) and
    nothing runs; a command from an untrusted login raises no event (`UNTRUSTED_COMMAND`);
    a seam that supplies a built fact refuses with `SEAM_REFUSED`.'
  - '**Missing context** — a failed permission read counts that login untrusted for
    the sync; a failed GraphQL edit read, dependency read or `gh api user` makes the
    sync incomplete, so issue facts raise `FactFailed` and the row waits; an unresolvable
    base ref or failed fetch counts as confirm (fail closed); no jq where tier-factory
    applies denies person subcommands; a missing `in/sync/issue-set.json` at row 66i
    is `issue_set_stale`, nothing launched.'
  interface_contracts:
  - '`bin/_flow_factory_text.py`: `spec_input_set(snapshot, needs_info, revouched)
    -> list`, `render_issue_md(items, others) -> str`, `digest(items) -> str` (sha256
    over the canonical JSON form of plan 5.3), `command_of(body) -> (name, rest) |
    None`, `is_command_line(body)`, `is_engine_marker(line)`; untrusted text fenced
    as `<<<UNTRUSTED_ISSUE_*>>>` with runs of three `<` or `>` neutralised to ‹‹‹
    / ›››.'
  - 'Outbox item schema `schemas/v1/factory-outbox.schema.json` (kind `FlowFactoryOutboxItem`):
    `id`, `job`, `row`, `state_at_write`, `ref`, `kind` (comment, label_add, label_remove,
    assign_label, pr_close), `blocking`, `key[]`, `argv[]`, `body_file`, `sha256`,
    `status` (recorded, pending_confirm, confirmed, sent, dropped), `effect`.'
  - job.json gains optional nullable fields (`base`, `write_seq`, `pending_intent`,
    `confirmed_intent`, `held_result`, `vouch_at`, `issue_digest`, `baseline_digest`,
    `needs_info`, `revouched_replies`, `priority_high`, ...); a pending event's `channel`
    widens to `^(terminal|launcher|session:.+|comment:[0-9]+)$`.
  - '`tiers.issueUpdate` (autonomous | journal | confirm) in settings.json, schema.json,
    tier-gate.sh and tier-runtime.sh; covers issue comment, label edit, close, reopen
    and the REST and GraphQL issue edit forms (Q9).'
  - 'Comment commands: line 1 `/flow-factory (answer|approve-spec|rework|reject|cancel|spec|retry)
    ...` from a login with triage access or higher; `/flow-factory answer NI-<k> <text>`
    for needs-info (Q17).'
  - Terminal `confirm <intent>` prints the literal, body and sha256 and exits 3 with
    `INTENT_CHANGED=<id> recorded=<hex> current=<hex>` or `INTENT_NOT_PENDING=<id>
    pending=<id>`; a `pending_confirm` notice becomes `confirmed` (Q16).
  - 'Intake judge reply: `{decision: ACCEPT|NEEDS_INFO|REJECT, risk, surfaces, scope,
    criteria, questions}`, charged from `total_cost_usd`.'
  risk_map:
  - area: untrusted_edit window
    plausible_wrong_version: counts edits before vouch_at, or reads only the last
      editor
    discriminating_check: 'edit history [outsider t2, trusted t3] after vouch_at t1
      → right: untrusted_edit true, row 51b; wrong (last editor only): false, job
      stays'
  - area: vouch_at source
    plausible_wrong_version: takes the first label event or `updated_at`
    discriminating_check: 'queue label added at t0 and again at t1 by write logins,
      outsider edit at t2 → right: vouch_at t1 and the edit counts (51b); wrong (first
      event t0 or updated_at t3): differs'
  - area: digest input
    plausible_wrong_version: hashes rendered issue.md or every trusted comment
    discriminating_check: 'a trusted "thanks" comment added → right: issue_digest
      unchanged; wrong: changed'
  - area: command comment in the spec-input set
    plausible_wrong_version: an `/flow-factory answer NI-1 x` comment counted as a
      reply and as an answer
    discriminating_check: 'that comment plus its answers-file entry → right: the set
      holds `["answer","NI-1","x"]` once, no comment item; wrong: two fenced copies
      and a different digest'
  - area: first-line matching
    plausible_wrong_version: marker or command matched anywhere in the body
    discriminating_check: 'an engine notice with `/flow-factory reject` on line 2
      → right: no event; wrong: a reject event'
  - area: notice dedupe
    plausible_wrong_version: the T:8u notice posted on every pass that re-applies
      the stay row
    discriminating_check: 'two passes with one untrusted reply and an unrelated comment
      in pass 2 → right: one post; wrong: two'
