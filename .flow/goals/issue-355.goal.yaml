objective:
  outcome: 'Issue #355 is implemented and verified.'
  source:
    issue_title: 'flow factory: only trusted issue text reaches agents, intake triages
      each issue, and GitHub writes are Tier 2'
  acceptance_criteria:
  - id: AC1
    text: An issue labelled by someone below triage access is not queued.
    verification_command: plugins/flow/tests/run.sh plugins/flow/tests/e2e-factory-text.test.sh
    must_pass: true
    status: pending
    evidence_ref: null
  - id: AC2
    text: Issue text given to stages holds the body and trusted comments only, fenced;
      untrusted comments are absent; an edit by an untrusted or unknown account fails
      closed.
    verification_command: plugins/flow/tests/run.sh plugins/flow/tests/e2e-factory-text.test.sh
      plugins/flow/tests/e2e-factory-intake.test.sh
    must_pass: true
    status: pending
    evidence_ref: null
  - id: AC3
    text: A trusted plain comment does not change the issue digest; a trusted `/flow-factory
      spec` comment does.
    verification_command: plugins/flow/tests/run.sh plugins/flow/tests/e2e-factory-text.test.sh
    must_pass: true
    status: pending
    evidence_ref: null
  - id: AC4
    text: Intake posts one notice for ACCEPT, NEEDS_INFO or REJECT; a malformed result
      is retried within the stage run limit (three runs), then the job goes to needs_human.
    verification_command: plugins/flow/tests/run.sh plugins/flow/tests/e2e-factory-intake.test.sh
      plugins/flow/tests/e2e-factory-transitions.test.sh
    must_pass: true
    status: pending
    evidence_ref: null
  - id: AC5
    text: In needs-info, a trusted reply naming the question id sends the job back
      to intake; the same reply from an author without write access counts only after
      a retry by triage access or higher.
    verification_command: plugins/flow/tests/run.sh plugins/flow/tests/e2e-factory-text.test.sh
      plugins/flow/tests/e2e-factory-intake.test.sh
    must_pass: true
    status: pending
    evidence_ref: null
  - id: AC6
    text: A trusted `/flow-factory` comment raises its action; an untrusted one does
      nothing; an engine comment is never a command.
    verification_command: plugins/flow/tests/run.sh plugins/flow/tests/e2e-factory-commands.test.sh
    must_pass: true
    status: pending
    evidence_ref: null
  - id: AC7
    text: '`tiers.issueUpdate` takes autonomous, journal and confirm like the other
      Tier 2 keys, in tier-gate, the settings schema and the docs.'
    verification_command: plugins/flow/tests/run.sh plugins/flow/tests/e2e-tier-gate.test.sh
      plugins/flow/tests/e2e-tier-runtime.test.sh plugins/flow/tests/e2e-tier-docs.test.sh
      plugins/flow/tests/flow-schemas.test.sh
    must_pass: true
    status: pending
    evidence_ref: null
  - id: AC8
    text: With a confirm key on the job path, the job parks in waiting_operator before
      it spends anything, and leaves when the key changes or a person confirms.
    verification_command: plugins/flow/tests/run.sh plugins/flow/tests/e2e-factory-github.test.sh
    must_pass: true
    status: pending
    evidence_ref: null
  - id: AC9
    text: A confirm by intent id shows the exact stored command, and refuses with
      INTENT_CHANGED when it differs from the one recorded.
    verification_command: plugins/flow/tests/run.sh plugins/flow/tests/e2e-factory-github.test.sh
      plugins/flow/tests/e2e-factory-engine-person.test.sh plugins/flow/tests/e2e-tier-factory.test.sh
    must_pass: true
    status: pending
    evidence_ref: null
  - id: AC10
    text: A repeated engine write is skipped because the earlier post is found.
    verification_command: plugins/flow/tests/run.sh plugins/flow/tests/e2e-factory-github.test.sh
    must_pass: true
    status: pending
    evidence_ref: null
  - id: AC11
    text: In a default-mode session tier-gate asks before person-only commands; in
      auto mode it denies them.
    verification_command: plugins/flow/tests/run.sh plugins/flow/tests/e2e-tier-factory.test.sh
    must_pass: true
    status: pending
    evidence_ref: null
  - id: AC12
    text: Every change ships with E2E tests through the harness, each scenario keeps
      a repeatable artifact, and the full suite passes before the push.
    verification_command: plugins/flow/tests/run.sh
    must_pass: true
    status: pending
    evidence_ref: null
  - id: AC13
    text: Merges to main without a release; the flow version is unchanged.
    verification_command: git diff --quiet origin/main -- plugins/flow/.claude-plugin/plugin.json
