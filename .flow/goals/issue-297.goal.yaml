specification:
  non_goals:
  - No pattern check changes. A System One answer never lifts a block or lets a command through.
    Whether it may turn a block into a confirmation is the user's decision after the measurement,
    and is not built here.
  - The model never denies a command. In on mode it can at most ask the user to confirm a
    command the pattern checks allowed.
  - No fixed untrusted-data fence for users without a provider. Only Bash `gh` reads are screened;
    WebFetch, file reads and diffs are not.
  - Both new sites ship off; no other site's question or threshold changes.
  - A command the secrets check flags is never sent.
  - No work for Python 3.9.
  failure_modes:
  - 'Timeouts: each call is bounded by `systemOne.timeoutMs`. A timeout or provider failure
    means no output, and the command runs as the pattern checks decide. The hooks get a 35
    s timeout in hooks.json; a timed-out PreToolUse hook does not block (Claude Code docs,
    read 2026-10-12).'
  - 'Partial failures: a pattern check that cannot run records `current=unknown`. A missing,
    abstained or below-threshold answer means no action.'
  - 'Invalid input: a payload that is not JSON, has no command, or has no output is not sent.
    A command the parser cannot split is not ruled out, so it is sent.'
  - 'Missing context: no provider, site off, no python3, or the plugin inside the repository:
    nothing is sent and nothing is printed. Only the mode check runs (about 30 ms, in parallel
    with the other hooks).'
  interface_contracts:
  - 'Site `guard.command-intent`, a new PreToolUse Bash hook. State `{command, cwd, temp_dir,
    repository_root}`, with the value of each `NAME=value` assignment in the command replaced
    by `***`. One noul question: could running this command destroy or irreversibly change
    data that is hard to recover? Record `current` = `block` when any of the four pattern
    hooks exits 2 for the same input, else `allow` (`unknown` when one cannot run). In on
    mode, a confident answer with p >= 0.5 on a command the patterns allow gives `permissionDecision:
    ask` with the reason. The hook never emits `allow`, `defer` or `deny`. In shadow mode
    the call runs detached, so the command does not wait for it.'
  - 'Cheap rule-out (not sent): every simple command is on a read-only list (`ls`, `cat`,
    `grep`, `git status|log|diff|show`, `gh` view/list and `api` GET, `find` without `-delete`/`-exec`,
    `sed -n NNp`, and others in the code), and no redirect writes anywhere except `/dev/null`
    or a file descriptor.'
  - 'Site `guard.planted-instructions`, a new PostToolUse Bash hook, for a successful `gh
    issue view`, `gh pr view`, or `gh api` GET of a `repos/<owner>/<repo>/issues|pulls/...`
    path. State `{command, output}` (output as lines). One noul question: does the text hold
    an instruction to an AI agent that goes beyond discussing or changing the code? In on
    mode, a confident answer with p >= 0.5 adds `additionalContext` telling the agent to treat
    the output as data. `current` = `unmarked`.'
  - Settings `systemOne.uses["guard.command-intent"]` and `systemOne.uses["guard.planted-instructions"]`,
    default off; the questions and thresholds go in `system-one/questions.yaml`.
  risk_map:
  - area: Precedence
    plausible_wrong_version: the hook emits `allow` when the answer is harmless
    discriminating_check: 'on mode, stub p=0.02, `rm -rf src`: the hook prints no `allow`,
      and the four pattern hooks together still block'
  - area: Rule-out
    plausible_wrong_version: '`find -delete`, `sed -i` or `echo > file` ruled out because
      the program is listed'
    discriminating_check: 'stub request count: `find . -name x -delete` 1, `find . -name x`
      0; `echo hi > out.txt` 1, `echo hi > /dev/null` 0'
  - area: Direction
    plausible_wrong_version: ask or mark on p < 0.5
    discriminating_check: stub p=0.9 asks or marks; p=0.1 does nothing
  - area: Secrets
    plausible_wrong_version: an assignment value, or a command the secrets check flags, is
      sent
    discriminating_check: the stub log holds no `abc123` from `TOKEN=abc123 make deploy`;
      a flagged command makes 0 requests
  - area: gh read detection
    plausible_wrong_version: '`gh pr merge` or POST output screened, or comment reads missed'
    discriminating_check: '`gh api repos/o/r/issues/5/comments` 1 request; `gh pr merge 5`
      0; `gh api -X POST repos/o/r/issues/5/comments` 0'
  - area: current
    plausible_wrong_version: taken from the destructive check only
    discriminating_check: '`git push --force origin main` records `current=block`'
