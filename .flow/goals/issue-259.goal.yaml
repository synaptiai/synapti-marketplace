specification:
  non_goals:
  - 'No Flow decision point calls the client in this issue. Sites are wired in #260-#271, so no command or hook output changes here.'
  - Flow does not depend at runtime on the TypeSafe plugin, its SDKs, or any other plugin.
  - 'No retries, backoff, or batching across calls: one HTTP request per call.'
  - 'No image input: imajev''s `images` field is never sent.'
  - 'No real tokenizer: the token limit is estimated as characters / 4.'
  - 'No questions for real decision points: the shipped questions file has no sites.'
  failure_modes:
  - '**Timeouts** — the request exceeds `systemOne.timeoutMs` (default 3000, clamped to 200-30000): no answer, reason `timeout`, exit 3; the caller keeps today''s behavior.'
  - '**Partial failures** — one question in a call abstains or is below its threshold while others answer: the whole call is no answer (all-or-nothing). Records still hold every question''s answer.'
  - '**Invalid input** — HTTP error (4xx, 5xx, 429, 529), a redirect, a body that is not JSON, a missing answer or an answer of the wrong type: no answer with a named reason. Invalid settings (unknown provider,
    remote `http://` URL, malformed env var name, unknown mode) mean no answer or mode off, with a WARN on stderr. Invalid arguments: exit 2.'
  - '**Missing context** — provider `none` or unset, a site absent from the questions file, an unset API key for TypeSafe, python3 or PyYAML missing, a refusal by `cascade-resolve.sh`: no answer and no
    network request.'
  interface_contracts:
  - 'CLI: `bin/flow-s1.sh ask --site <id> --state-file <path> [--current <decision>] [--run-id <id>]`. Site id matches `^[a-z][a-z0-9_-]*(\.[a-z0-9_-]+)*$`.'
  - 'Exit 0: stdout is one JSON line `{"site","provider","model","truncated","answers":{<qid>:{...}}}`. Exit 3: no answer, stdout empty, stderr `flow-s1: no answer: <reason>`. Exit 2: usage error.'
  - 'Normalized answers: noul `{type:"noul", p, confidence}` with confidence = |2p-1|; choice `{type:"choice", choice, probabilities, confidence}`; score `{type:"score", score, probabilities, confidence}`;
    `unknown_probability` is copied when the provider sends it.'
  - 'Settings: `systemOne.provider` (`none|typesafe|imajev|custom`), `baseUrl`, `model`, `apiKeyEnv`, `timeoutMs`, `stateTokenCap` are read with `cascade-resolve.sh --no-repo-settings` (user tier and plugin
    default only). `systemOne.uses.<site>` (`off|shadow|on`, default off) is read from the full cascade.'
  - 'Request: `POST <baseUrl>/v1/systemone`, JSON `{state, questions, model}`. `Authorization: Bearer <key>` is sent only when the named env var is set and non-empty. Redirects are never followed. A non-loopback
    URL must be `https://`.'
  - 'Questions file `plugins/flow/system-one/questions.yaml`: `sites.<id>.questions` (sent as-is), `sites.<id>.thresholds.<qid>` = `{default: <0..1>, models: {<model id>: <0..1>}}`, looked up by the model
    id the response names.'
  - Shadow mode makes the request, writes records, and exits 3. On mode writes records and exits 0 when answered.
  - 'Records: one JSON line per question, `{ts, site, question, provider, model, result, answer, current, state_sha256}`, appended to `.flow/runs/<run-id>/system-one.jsonl` when `--run-id` names an existing
    run, else `${FLOW_STATE_DIR:-~/.claude/flow-state}/system-one.jsonl`. The state itself is never recorded. A symlink is never written through.'
  risk_map:
  - area: settings tier for provider and address
    plausible_wrong_version: reads `baseUrl` through the full cascade, so the repository's settings win
    discriminating_check: 'user settings baseUrl=stub A, repo `.claude/settings.flow.json` baseUrl=stub B → right: A receives the request, B''s log is empty; wrong: B receives it'
  - area: noul confidence
    plausible_wrong_version: uses p itself as the confidence, so a confident "no" is below threshold
    discriminating_check: 'noul p=0.05, threshold 0.8 → right: answer with confidence 0.9; wrong: no answer'
  - area: threshold key
    plausible_wrong_version: looks up the threshold by the configured model name (an alias) rather than the model that answered
    discriminating_check: 'configured `jev-latest`, reply model `jev-1.13.0`, thresholds default 0.95 and `jev-1.13.0`: 0.5, choice confidence 0.7 → right: answer; wrong: no answer'
  - area: shadow mode
    plausible_wrong_version: returns the answer to the caller in shadow mode
    discriminating_check: 'mode shadow, stub replies confidently → right: exit 3, empty stdout, one record written; wrong: exit 0 with the JSON'
  - area: redirects
    plausible_wrong_version: follows a redirect and forwards the bearer key to another host (Python's default opener does this on 301/302/303 and refuses 307/308 for a POST)
    discriminating_check: 'stub A replies 302 to stub B → right: no answer, B''s log is empty; wrong: B receives a GET with Authorization'
  - area: partial answers
    plausible_wrong_version: returns the questions that answered when another abstained
    discriminating_check: 'two questions, one `abstained: true` → right: exit 3; wrong: exit 0 with one answer'
