objective:
  outcome: 'Issue #198 is implemented and verified.'
  source:
    type: github_issue
    number: 198
    title: 'fix(dossier): claim-scan''s redact() has incomplete coverage -- leaves
      fragments and misses 4 whole leak classes'
  acceptance_criteria:
  - id: AC1
    text: 'A credential-shaped string interrupted by any non-token character (not
      just |) produces no fragment of the original value in the findings excerpt,
      in either --json or plain-text output, for the 7 credential classes whose patterns
      support this (anthropic-key, github-token, aws-access-key, slack-token, bearer-token,
      secret-assignment, private-key-block). connection-string''s exact-format pattern
      does not yet cover a lone interrupted occurrence -- deferred to issue #210 per
      explicit product decision (a naive fix creates a real false-positive on an ordinary
      scheme mention with no credential).'
    verification_command: bash plugins/dossier/tests/run.sh disclosure-gate.test.sh
    must_pass: true
    status: evidence_collected
    last_result: 'exit_code=0 reason=disclosure-gate.test.sh 161/161 pass, including
      11 new interrupted-token fixtures across all 8 credential classes; AC1 satisfied
      for 7 of 8 classes (connection-string exact-format gap deliberately deferred
      to issue #210, user-authorized)'
    evidence_ref: .flow/runs/2026-09-15T110500Z-issue-198/evidence/evidence-ac1-ac2-ac3-disclosure-gate-turn3.evidence.yaml
  - id: AC2
    text: Existing disclosure-gate.test.sh redaction assertions continue to pass unchanged.
    verification_command: bash plugins/dossier/tests/run.sh disclosure-gate.test.sh
    must_pass: true
    status: evidence_collected
    last_result: 'exit_code=0 reason=disclosure-gate.test.sh 161/161 pass, including
      11 new interrupted-token fixtures across all 8 credential classes; AC1 satisfied
      for 7 of 8 classes (connection-string exact-format gap deliberately deferred
      to issue #210, user-authorized)'
    evidence_ref: .flow/runs/2026-09-15T110500Z-issue-198/evidence/evidence-ac1-ac2-ac3-disclosure-gate-turn3.evidence.yaml
  - id: AC3
    text: New test coverage for at least one interrupted-token case per credential
      class currently defined in redact().
    verification_command: bash plugins/dossier/tests/run.sh disclosure-gate.test.sh
    must_pass: true
    status: evidence_collected
    last_result: 'exit_code=0 reason=disclosure-gate.test.sh 161/161 pass, including
      11 new interrupted-token fixtures across all 8 credential classes; AC1 satisfied
      for 7 of 8 classes (connection-string exact-format gap deliberately deferred
