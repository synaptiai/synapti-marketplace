specification:
  non_goals:
  - An embeddings store - the corpus is tens of rules per project and an embedding
    query is a network call, which bin/flow-mine-corrections.sh rules out by design.
  - A fine-tuned rejection predictor - a LoRA classifier cannot ship inside a markdown
    plugin.
  - Suppressing security findings - an exception annotates a security finding and
    names itself; it never removes one.
  - A review run writing .flow/review-exceptions.md - the file is a team contract,
    written by hand or by promoting a /flow:learn proposal.
  - Cross-repository exceptions.
  - Re-opening the finding-ledger marker grammar - DISPUTED already exists; this issue
    fills it.
  failure_modes:
  - 'Timeouts: one new gh api call per review and pr Phase 1, no explicit timeout,
    matching every other gh call in those fences; a failure reports STATE=unavailable,
    never STATE=none.'
  - 'Partial failures: an exceptions file that does not parse reports STATE=unavailable
    with the reason rather than handing over half the rows; a journal-record.sh failure
    while writing finding-dismissed must not fail the address run.'
  - 'Invalid input: a reason outside the closed set, or a table row missing a column,
    is named in the output rather than dropped.'
  - 'Missing context: a pull request with no FLOW_REVIEW_CYCLE marker has no ledger
    ids, and that is reported as the reason no artifact was written, not as a dismissal
    with an invented id.'
  interface_contracts:
  - 'finding-dismissed artifact: pr, cycle, finding_id, category, location, by (address
    or review), reason from the closed set, evidence.'
  - 'Closed reason set: factually-incorrect, breaks-test, contradicts-claude-md, critic-evidence,
    critic-unrefuted-concern, self-review-refuted.'
  - '.flow/review-exceptions.md: a table with columns Rule, Scope (path glob), Why,
    Source; tracked in git alongside goals.'
  - 'Review Exceptions section: STATE=ok|none|unavailable, EXCEPTIONS_REF=<base sha>,
    one EXCEPTION= line per row with a literal pipe written %7C, REASON= when unavailable.'
  - 'templates/skill-proposal.md frontmatter gains type: skill, enforcement or exception;
    bin/promote-proposal.sh branches on it and refuses an unknown type.'
  - 'Every reviewer dispatch carries the exceptions plus the rule: do not raise a
    finding that matches a listed exception; if you raise it anyway, label it exception-override
    and say why.'
  risk_map:
  - area: Exception trust
    plausible_wrong_version: The exceptions are read from the pull request head or
      the working tree, so a pull request grants itself an exemption
    discriminating_check: 'A fixture whose base and head hold different exceptions
      files: the base rule is printed and the head-only rule does not appear anywhere
      in the section'
  - area: Absent vs unreadable
    plausible_wrong_version: A failed read prints STATE=none, telling every reviewer
      there are no exceptions when the team wrote several
    discriminating_check: A 403 or 5xx prints STATE=unavailable naming the status;
      only a 404 at the base commit is STATE=none
  - area: Security suppression
    plausible_wrong_version: An exception matching a security finding removes it from
      the report
    discriminating_check: A security finding whose text matches a listed exception
      is still reported, labelled exception-override, with the matching exception
      named
  - area: Dispatch coverage
    plausible_wrong_version: The exceptions reach some dispatch blocks and not others
      - the existing Risk areas triplet is in 3 of 27 prompts today
    discriminating_check: A parity test asserts all four fan-out blocks (review Path
      A, review Path B, pr Phase 3, address Phase 4) carry the exceptions text
  - area: Dismissal identity
    plausible_wrong_version: finding_id is recorded as a GitHub comment id, so clusters
      cannot join to the ledger and DISPUTED stays empty
    discriminating_check: A dismissed finding carries the same ledger id in the artifact
      and in the DISPUTED array of the resolution marker
  - area: Proposal reachability
    plausible_wrong_version: exception proposals are written but nothing can promote
      them, so the loop never closes
    discriminating_check: promote-proposal.sh on a type exception proposal appends
      its row to .flow/review-exceptions.md and leaves skills/learned/ untouched
