kind: FlowGoal
metadata:
  id: issue-178
  created_at: '2026-09-14T22:50:00Z'
  created_by: /flow:start
  owner: daniel.bentes@synapti.ai
scope:
  repo: synaptiai/synapti-marketplace
  branch: feature/issue-178-scaffold-repair-visibility
  issue: 178
  journal: .decisions/issue-178.md
objective:
  outcome: 'Issue #178 is implemented and verified.'
  source:
    type: github_issue
    number: 178
    title: 'fix(dossier): scaffold overwrites non-frontmatter files and reports them
      as CREATED, not REPAIRED'
  acceptance_criteria:
  - id: AC1
    text: A repaired file (existing, non-frontmatter-fenced, overwritten) is counted
      in a new SCAFFOLD_REPAIRED summary line and is no longer also counted in SCAFFOLD_CREATED
      or emitted as a second CREATED <path> line in ACTIONS — a repaired file produces
      exactly one REPAIRED <path> action line, never a CREATED line for the same path.
    verification_command: bash plugins/dossier/tests/run.sh bin-scripts.test.sh
    must_pass: true
    status: pending
  - id: AC2
    text: The repair path emits a message to stderr naming the file and the byte count
      of the content it replaced.
    verification_command: bash plugins/dossier/tests/run.sh bin-scripts.test.sh
    must_pass: true
    status: pending
  - id: AC3
    text: The script's header comment (dossier-scaffold.sh) no longer states scaffolding
      unconditionally "never overwrites" an existing file; it states the actual, fence-conditional
      behavior.
    verification_command: '! grep -q "NEVER overwritten, never truncated" plugins/dossier/bin/dossier-scaffold.sh'
    must_pass: true
    status: pending
  - id: AC4
    text: The doc-package-contract skill's matching claim (plugins/dossier/skills/doc-package-contract/SKILL.md)
      is corrected the same way.
    verification_command: '! grep -q "never overwrites an existing file" plugins/dossier/skills/doc-package-contract/SKILL.md'
    must_pass: true
    status: pending
  - id: AC5
    text: shellcheck -S warning plugins/dossier/bin/dossier-scaffold.sh passes with
      no new warnings.
    verification_command: shellcheck -S warning plugins/dossier/bin/dossier-scaffold.sh
    must_pass: true
    status: pending
specification:
  non_goals:
  - Not reconsidering whether "no frontmatter fence" is the right damage test at all
    — this fix keeps the existing fence-based damage detection and only fixes its
    counter visibility and documentation.
  - Not adding a .bak-move-aside behavior for non-empty, non-frontmatter files — a
    different, larger design change the issue only floats as a possibility, not a
    requirement.
  - Not adding a --json output mode — dossier-scaffold.sh has no JSON mode today,
    and this fix stays within the existing plain-text KEY=value + ACTIONS contract.
  - Not changing the DEST_INTACT / empty-file detection logic (introduced in the 1.0.2
    fix for truncated files) — only the reporting of what happens after a file is
    judged damaged.
  failure_modes:
  - 'Timeouts: none — local filesystem copy operations only, no network.'
  - 'Partial failures: a single file''s copy failure is already handled (FAILED counter,
    FAILED <path> action line); this fix must not change that path, only the REPAIRED/CREATED
    distinction for successful copies.'
  - 'Invalid input: n/a — the script''s existing argument parsing is unchanged.'
  - 'Missing context: n/a — no new external dependency or config is introduced.'
  interface_contracts:
  - 'CLI contract unchanged: dossier-scaffold.sh [--output-root <path>] [--dry-run],
    exit codes unchanged (0 success, 1 on any FAILED count > 0).'
  - Plain-text summary gains one new additive line SCAFFOLD_REPAIRED=<n>, placed alongside
    the existing SCAFFOLD_CREATED/SCAFFOLD_SKIPPED/SCAFFOLD_FAILED lines — does not
    remove or reorder existing SCAFFOLD_* lines.
  - A repaired file's ACTIONS output changes from two lines (REPAIRED then CREATED)
    to exactly one (REPAIRED) — existing consumers asserting CREATED=23 on a clean
    first scaffold (no repairs) are unaffected.
  - New stderr-only diagnostic on the repair path names the file and the byte count
    of the content it replaced. Not part of the stdout KEY=value contract.
  risk_map:
  - area: REPAIRED/CREATED fallthrough
    plausible_wrong_version: the fix adds a SCAFFOLD_REPAIRED counter but forgets
      to also suppress the CREATED increment/line for the same path, so both counters
      now count the same repair
    discriminating_check: 'fixture: a non-frontmatter-fenced existing file at a canonical
      path, run once → right: SCAFFOLD_REPAIRED=1, SCAFFOLD_CREATED=<n minus this
      file>, exactly one REPAIRED <path> line and no CREATED <path> line for it; wrong:
      both counters increment or both action lines appear'
  - area: clean-first-scaffold regression
    plausible_wrong_version: the fix accidentally changes CREATED counting for files
      that were never damaged (a true first-run creation), conflating "created because
      absent" with "created because repaired"
    discriminating_check: 'fixture: run scaffold into an empty output root (no pre-existing
      files at all) → right: SCAFFOLD_REPAIRED=0, SCAFFOLD_CREATED=23, no REPAIRED
      lines; wrong: SCAFFOLD_REPAIRED non-zero or SCAFFOLD_CREATED under 23'
  - area: SKIPPED path untouched
    plausible_wrong_version: the fix's changes to the DEST_INTACT branch accidentally
      also touch the "file starts with ---, is skipped" path
    discriminating_check: 'fixture: a properly frontmatter-fenced existing file at
      a canonical path → right: unchanged, SCAFFOLD_SKIPPED=1, byte-identical file
      after run, no REPAIRED/CREATED line for it; wrong: it gets repaired or re-created'
  - area: header-comment correction scope
    plausible_wrong_version: correcting the "never overwritten" claim at the script
      header also needs to land in the doc-package-contract skill's own copy of the
      same claim, or the two go out of sync again
    discriminating_check: 'grep both files for the exact old unqualified phrasing
      after the fix → right: neither file contains it; wrong: only one was corrected'
constraints:
  tdd_required: true
  require_all_pass: true
  no_calendar_estimates: true
  no_tier3_without_confirmation: true
  allowed_paths:
