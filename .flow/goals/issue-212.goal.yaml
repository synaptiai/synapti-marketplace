  issue: 212
  journal: .decisions/issue-212.md
objective:
  outcome: 'Issue #212 is implemented and verified.'
  source:
    type: github_issue
    number: 212
    title: 'fix(flow): finding confidence is display-only, and the review rules disagree
      about whether it blocks'
  acceptance_criteria:
  - id: AC1
    text: skills/code-review-methodology/SKILL.md carries one rule for how confidence
      enters the decision, and a test reads both the "Confidence and signal" section
      and the decision table and fails when "Only High-confidence P1s block merge"
      coexists with an unconditional `Any P1 | REQUEST_CHANGES` row.
    verification_command: bash plugins/flow/tests/run.sh plugins/flow/tests/finding-confidence.test.sh
    must_pass: true
    status: pending
    evidence_ref: null
  - id: AC2
    text: commands/review.md Phase 4 step 6 routes LOW-confidence findings on an external
      PR to a `#### Needs investigation` section and excludes them from the decision
      and from the FLOW_REVIEW_CYCLE marker; the marker-emission step (step 7) states
      the exclusion; a test asserts both statements are present.
    verification_command: bash plugins/flow/tests/run.sh plugins/flow/tests/finding-confidence.test.sh
    must_pass: true
    status: pending
    evidence_ref: null
  - id: AC3
    text: commands/review.md Phase 4 step 5 (self-review) requires each LOW finding
      to end as fixed (HIGH), as a `dropped-finding` artifact with `reason=self-review-refuted`,
      or escalated and recorded MEDIUM; references/decision-journal-schema.md documents
      that reason value.
    verification_command: bash plugins/flow/tests/run.sh plugins/flow/tests/finding-confidence.test.sh
    must_pass: true
    status: pending
    evidence_ref: null
  - id: AC4
    text: references/finding-schema.md moves `confidence` from optional to required
      for code-reviewer, security-reviewer, error-handler-inspector and integration-verifier,
      states the absent-value rule (MEDIUM plus LEDGER_WARN), and each of those four
      agent files requires confidence per finding under the schema's three-tier rule
      (running or LSP → HIGH, read code path → MEDIUM, pattern match → LOW).
    verification_command: bash plugins/flow/tests/run.sh plugins/flow/tests/finding-confidence.test.sh
    must_pass: true
    status: pending
    evidence_ref: null
  - id: AC5
    text: templates/review-comment.md, templates/self-review-comment.md and templates/pr-body.md
      carry a `Needs investigation` section separate from the P1/P2/P3 counts, so
      an unverified finding is never counted as a resolved defect.
    verification_command: bash plugins/flow/tests/run.sh plugins/flow/tests/finding-confidence.test.sh
    must_pass: true
    status: pending
    evidence_ref: null
  - id: AC6
    text: plugins/flow/tests/run.sh passes.
    verification_command: bash plugins/flow/tests/run.sh
    must_pass: true
    status: pending
    evidence_ref: null
  - id: AC7
    text: bin/flow-finding-route.sh reads consolidated finding rows and the review
      mode and prints per-priority counts excluding LOW on an external review, the
      Needs investigation ids, the decision, the 7-field marker rows with no LOW row,
      and a LEDGER_WARN naming the agent for each absent or invalid confidence (treated
      as MEDIUM); commands/review.md steps 6 and 7 run it.
    verification_command: bash plugins/flow/tests/run.sh plugins/flow/tests/flow-finding-route.test.sh
    must_pass: true
    status: pending
    evidence_ref: null
specification:
  non_goals:
  - Merge gate Check 1 (ESCALATED) and Check 2 (FINDINGS − RESOLVED) and DISPUTED
    semantics are unchanged; dismissals belong to
  - The marker parsers in commands/merge.md, commands/status.md and references/finding-ledger-parser.md
    are unchanged; they already accept 7-field rows and read only ID and priority.
    LOW routing happens where the marker is written, not where it is read.
  - Confidence never changes a finding's priority or category; a LOW P1 stays P1 inside
    Needs investigation.
  - No numeric or calibrated confidence score and no threshold setting; three words
    only (#211 rejected min_confidence_score).
  - Path A's consolidation table (which disposition earns which confidence) is unchanged.
  - convention-checker and test-runner are not moved onto the confidence rule; they
    are not on the finding schema.
  - /flow:address resolution handling is unchanged.
  failure_modes:
  - 'Timeouts: none — the change adds no network or agent call; Path A reviewer timeouts
    keep today''s fallback (MEDIUM|unchallenged).'
  - 'Partial failures: an agent gives confidence on some findings and not others —
    each missing one becomes MEDIUM with its own LEDGER_WARN naming the agent, and
    the rest keep their values. A self-review LOW finding that no test or command
    can reproduce or refute is escalated with the six-field structure and listed in
    ESCALATED of the resolution marker; it is never left LOW and never recorded HIGH.'
  - 'Invalid input: a confidence other than HIGH, MEDIUM or LOW (matched case-insensitively)
    is treated as absent — MEDIUM plus a LEDGER_WARN naming the agent and the value.'
  - 'Missing context: PR_AUTHOR or CURRENT_USER resolves empty — Phase 4 step 4 halts
    with an error instead of comparing two empty strings as equal and taking the self-review
    path.'
  interface_contracts:
  - 'Agent finding row (code-reviewer, security-reviewer, error-handler-inspector,
    integration-verifier): Finding cell ends with a required _(HIGH|MEDIUM|LOW)_ suffix;
    the orchestrator renders _(CONFIDENCE · disposition)_ on both paths.'
  - 'FLOW_REVIEW_CYCLE marker: 7-field on Path A and Path B (ID|priority|category|location|status|confidence|disposition);
    Path B disposition is unchallenged. No LOW row is written. Legacy 5-field rows
    still parse.'
  - 'External review body: #### Needs investigation after P3, one entry per LOW finding
    (id · priority · category · location, problem, Pattern:, Confirm or refute:).
    Header P1: X, P2: Y, P3: Z · Needs investigation: N, LOW excluded from X, Y, Z.'
  - 'Decision table: any HIGH or MEDIUM P1 → REQUEST_CHANGES; any HIGH or MEDIUM P2
    → REQUEST_CHANGES; HIGH or MEDIUM P3 only → COMMENT; none, or LOW only → APPROVE.'
  - 'dropped-finding journal artifact: cycle, finding_id, facet, reason=self-review-refuted,
    pr, via bin/journal-record.sh.'
  - 'LEDGER_WARN: PR#<N> finding ''<id>'' from <agent> has no confidence — treated
    as MEDIUM; LEDGER_WARN: PR#<N> finding ''<id>'' from <agent> has invalid confidence
    ''<value>'' — treated as MEDIUM.'
  - review-cycle journal path metadata names the orchestration that ran (A or B);
    it is no longer inferred from marker width.
  - 'templates/pr-body.md and templates/self-review-comment.md: a Needs investigation
    section listing each LOW finding and its outcome, separate from the P1/P2/P3 counts.'
  risk_map:
  - area: absent confidence
    plausible_wrong_version: treats a missing confidence as LOW (demotion by omission)
    discriminating_check: 'external PR, one P1 with no confidence → right: MEDIUM,
      REQUEST_CHANGES, marker row present, LEDGER_WARN naming the agent; wrong: listed
      under Needs investigation, APPROVE, no marker row'
  - area: exclusion scope
    plausible_wrong_version: excludes LOW findings on the agent's own PR too
    discriminating_check: 'own PR, one LOW P2 → right: ends fixed and HIGH with a
      test, or dropped-finding reason=self-review-refuted; wrong: listed as an open
      investigation'
  - area: marker vs decision
    plausible_wrong_version: drops LOW from the decision but still writes its marker
      row
    discriminating_check: 'external PR, F1 HIGH P2 and F2 LOW P1 → right: FINDINGS:[F1|…]
      only; wrong: F2 in the marker, so merge Check 2 blocks on it'
  - area: header counts
    plausible_wrong_version: counts LOW findings in the P1/P2/P3 counts
    discriminating_check: 'same PR → right: P1: 0, P2: 1, P3: 0 · Needs investigation:
      1; wrong: P1: 1, P2: 1'
  - area: contradiction test
    plausible_wrong_version: the test can only confirm (checks the phrase's absence
      only)
    discriminating_check: fixture with the phrase and an Any P1 row → fires; fixture
      with conditional rows and one rule → silent; fixture with no decision table
      → fails
  - area: only-LOW decision
    plausible_wrong_version: posts COMMENT or REQUEST_CHANGES when every finding is
      LOW
    discriminating_check: 'external PR, only F1 LOW P1 → right: --approve with the
      section; wrong: --request-changes'
