  - id: AC3
    text: Every probe has a result of go, no-go, deferred or not run. A no-go names
      the fallback taken or the phases it stops; a deferred result names the phase
      whose issue now carries that go condition; a not-run result names why.
    verification_command: plugins/flow/bin/flow-factory.sh probe --verify-record docs/flow-factory/probes.json
      --dispositions
    must_pass: true
    status: evidence_collected
    evidence_ref: .flow/runs/2026-11-12T122249Z-issue-353/evidence/eval-20261114t172740z-ac3.evidence.yaml
    last_evaluated_at: '2026-11-14T17:27:40Z'
    last_result: pass
  - id: AC4
