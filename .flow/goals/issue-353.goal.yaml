      git calls made through PATH and by the Bash commands the recorded runs made (gh or git run by its path, and
      HTTP clients naming a GitHub host). A write hidden from both, such as one inside a script a command ran, is
      not covered.
    verification_command: plugins/flow/bin/flow-factory.sh probe --verify-record docs/flow-factory/probes.json
      --writes-only-to danielbentes/flow-factory-sandbox
    must_pass: true
    status: evidence_collected
