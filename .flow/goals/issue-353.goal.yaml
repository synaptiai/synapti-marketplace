    verification_command: plugins/flow/bin/flow-factory.sh probe --verify-record docs/flow-factory/probes.json
    must_pass: true
    status: evidence_collected
    evidence_ref: .flow/runs/2026-11-12T122249Z-issue-353/evidence/eval-20261114t172740z-ac2.evidence.yaml
    last_evaluated_at: '2026-11-14T17:27:40Z'
