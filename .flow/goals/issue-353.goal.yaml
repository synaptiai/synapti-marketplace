specification:
  non_goals:
  - No job engine, queue, job state or worker launching (phase 1a and later). Only
    the flow-factory.sh wrapper skeleton and the probe module.
  - No change to existing flow commands, hooks or tier-gate behaviour.
  - No GitHub writes outside danielbentes/flow-factory-sandbox; P1 makes none at all
    (gh is stubbed and logged).
  - No `go` for a condition that needs a phase 1 part; it is recorded `deferred` and
    added to that phase's issue.
  - P8 is not run (no second GitHub account available).
  - No support for Python older than 3.14.
  failure_modes:
  - '**Timeouts** — every `claude -p` run has a turn limit, a budget limit and a hard
    kill; a timed-out probe is recorded no-go with reason timeout, never go.'
  - '**Partial failures** — each probe is recorded on its own. A failed prerequisite
    (P11 interpreter, P3 auth) marks its dependents not_run. When the $25 model-spend
    cap would be passed, the remaining model probes are recorded not_run with reason
    budget.'
  - '**Invalid input** — a missing sandbox, a token with write access or the wrong
    repository is refused with a named reason; a token that can write makes P3 no-go.'
  - '**Missing context** — no claude, gh, jq, timeout/gtimeout or Python 3.14 with
    PyYAML: refuse and name the tool. Keychain token (service flow-factory-gh-token)
    absent: P3''s token part is not_run with reason token-missing.'
  interface_contracts:
  - '`flow-factory.sh context --mode`: with FLOW_FACTORY_JOB and FLOW_FACTORY_DIRECTIVE
    unset, prints exactly `FACTORY_MODE=off`, exits 0, starts no Python.'
  - '`flow-factory.sh probe --platform | --environment | --github-write --sandbox
    <owner/repo>`: writes `<runtime dir>/factory/probes.json`.'
  - 'probes.json validates against `schemas/v1/factory-probes.schema.json`: per group
    the values it was keyed on and when it ran; per probe id, result (go | no-go |
    deferred | not_run), reason, fallback, deferred_to, evidence path, cost.'
  - Every other subcommand exits 5 with `FACTORY_REFUSED=<reason>`.
  - 'Committed copies: `docs/flow-factory/probes.json` and `docs/flow-factory/probe-results.md`,
    with the tool versions each probe ran against.'
  risk_map:
  - area: Result classification of stand-in probes
    plausible_wrong_version: a probe run against a stand-in is recorded `go`
    discriminating_check: P2 with the stub deny rule firing → right `deferred` (to
      1b); wrong `go`
  - area: Interpreter resolution
    plausible_wrong_version: a pyenv shim is accepted as the interpreter
    discriminating_check: probe run from a worktree with `.python-version` = 3.12
      → right records ~/.pyenv/versions/3.14.7/bin/python3.14; wrong records a shim
      that runs 3.12
  - area: Worker token write check
    plausible_wrong_version: any 4xx is read as "cannot write"
    discriminating_check: invalid-body POST with a write-capable token returns 422
      → right no-go (token can write); wrong go
  - area: Model spend cap
    plausible_wrong_version: the cap is checked after a run starts
    discriminating_check: $24 spent, next run limit $2 → right not_run (budget); wrong
      run starts, total reaches $26
  - area: context --mode independence
    plausible_wrong_version: the wrapper starts Python or reads probes.json for `context
      --mode`
    discriminating_check: python3 removed from PATH → right `FACTORY_MODE=off`, exit
      0; wrong error, non-zero exit
