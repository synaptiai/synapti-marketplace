objective:
  outcome: 'Issue #314 is implemented and verified.'
  source:
    issue_title: 'ci(flow): the Linux test job runs 31 to 44 minutes against its 45-minute
      limit and is cancelled on slow runners'
  acceptance_criteria:
  - id: AC1
    text: 'On a runner 30% slower than the 38-minute run on main, the flow suite on
      Linux completes without being cancelled (per Linux part: slowest part x 1.3
      <= its 20-minute limit).'
    verification_command: gh run list --repo synaptiai/synapti-marketplace --workflow
      flow-tests.yml --branch feature/issue-314-split-linux-flow-tests --limit 1 --json
      databaseId --jq '.[0].databaseId' | xargs -I{} gh run view {} --repo synaptiai/synapti-marketplace
      --json jobs --jq '[.jobs[] | select(.name | startswith("test (ubuntu-latest"))
      | select(.conclusion == "success") | ((.completedAt | fromdate) - (.startedAt
      | fromdate))] | if length == 4 and (max * 1.3 <= 1200) then "PASS slowest \(max)
      s" else error("FAIL") end'
    must_pass: true
    status: pending
    evidence_ref: null
    last_evaluated_at: null
    last_result: null
  - id: AC2
    text: The time limit, or each part's time limit, leaves at least 20% headroom
      over the slowest passing run measured when the change is made (20 minutes >=
      slowest passing Linux part x 1.2).
    verification_command: gh run list --repo synaptiai/synapti-marketplace --workflow
      flow-tests.yml --branch feature/issue-314-split-linux-flow-tests --limit 1 --json
      databaseId --jq '.[0].databaseId' | xargs -I{} gh run view {} --repo synaptiai/synapti-marketplace
      --json jobs --jq '[.jobs[] | select(.name | startswith("test (ubuntu-latest"))
      | select(.conclusion == "success") | ((.completedAt | fromdate) - (.startedAt
      | fromdate))] | if length == 4 and (1200 >= max * 1.2) then "PASS slowest \(max)
      s" else error("FAIL") end'
    must_pass: true
    status: pending
    evidence_ref: null
    last_evaluated_at: null
    last_result: null
specification:
  non_goals:
  - No test file is made faster.
  - macOS stays one job with its 45-minute limit.
  - 'The set of tests run does not change: each file runs in exactly one Linux job.'
  - Files are assigned round-robin by sorted name, with no timing-based balancing.
  failure_modes:
  - '**Timeouts** — each Linux shard job has its own 20-minute limit; only that shard
    shows cancelled.'
  - '**Partial failures** — fail-fast stays off, so every shard reports and uploads
    its own artifacts.'
  - '**Invalid input** — a malformed FLOW_TEST_SHARD (not K/N, K<1, K>N, N<1, non-digits)
    makes run.sh exit 2 with a message and run no file.'
  - '**Missing context** — FLOW_TEST_SHARD unset means run all files, as today.'
  interface_contracts:
  - 'run.sh reads FLOW_TEST_SHARD=K/N (integers, 1<=K<=N) and runs the files whose
    0-based position i in its list has i mod N = K-1; it prints `run.sh: shard K/N
    runs X of Y files` and unsets the variable so suites do not inherit it.'
  - 'The CI matrix has entries {os, shard, shards}: Linux 1..4 of 4, macOS 1 of 1;
    artifact names are `flow-e2e-<os>-<shard>-of-<shards>`.'
  risk_map:
  - area: shard index base
    plausible_wrong_version: 'off by one: i mod N = K instead of K-1'
    discriminating_check: 'files a..e, shards 1/2 and 2/2 → right: {a,c,e} and {b,d};
      wrong: a file dropped or shard 2 empty'
  - area: explicit file arguments
    plausible_wrong_version: selection applied only to the glob
    discriminating_check: '3 named files with 1/3 → right: 1 file runs; wrong: all
      3 run'
  - area: variable inheritance
    plausible_wrong_version: suites see FLOW_TEST_SHARD
    discriminating_check: 'a fixture test prints FLOW_TEST_SHARD → right: unset; wrong:
      1/2'
  - area: value validation
    plausible_wrong_version: malformed values accepted
    discriminating_check: '0/4, 5/4, 1/0, a/b, 1/4x → right: exit 2, no file runs;
      wrong: some files run'
