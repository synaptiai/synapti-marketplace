specification:
  non_goals:
  - 'The judge path is unchanged: when no must_pass criterion fails deterministically, the delta still comes from the judge.'
  - '`failAfterStuckTurns`, its default of 3, the turn budget and the throttle are unchanged.'
  - Which criteria fail, and the continuation prompt that names them, are unchanged.
  - No change to `/flow:goal evaluate` or to the manual evaluator.
  failure_modes:
  - '**Timeout:** none — the comparison reads and writes one local file; no process or network call is added.'
  - '**Partial failure:** the previous-failures file cannot be written (disk full, permission): the turn is recorded as `unchanged`, as today, with a stderr note. The stuck counter''s own fail-closed rule
    is untouched, so the loop cannot run forever.'
  - '**Invalid input:** the previous-failures file is unreadable, is a symlink, or holds an id that is not a criterion id: it is treated as absent (`unchanged`, as today), and a symlink is never written
    through.'
  - '**Missing context:** no previous record (the first failing turn, or the first failing turn after a passing turn reset the count): `unchanged`, as today.'
  interface_contracts:
  - 'Delta values stay the existing enum: `made_progress | unchanged | regressed`. For a goal with a run, the deterministic path''s delta is written to `.flow/runs/<id>/last-verdict.json` as today, now
    computed.'
  - 'The previous turn''s deterministically failing set (must_pass criterion ids plus path violations) is stored next to the stuck counter: `.flow/runs/<id>/stuck-failing` for a goal with a run, `<FLOW_STATE_DIR>/stuck/<key>-<goal>.failing`
    without one. One entry per line, sorted, unique. It is removed wherever the stuck counter is removed.'
  - 'Delta rule, comparing this turn''s set C with the previous set P: P absent → `unchanged`; C == P → `unchanged`; C contains an entry not in P → `regressed`; otherwise (C a strict subset of P) → `made_progress`.'
  - Only `unchanged` increments the stuck counter, as today; any other delta resets it.
  risk_map:
  - area: set comparison
    plausible_wrong_version: Any change in the set counts as progress, so swapping one failure for another ({AC1} then {AC2}) resets the counter
    discriminating_check: '{AC1} then {AC2}: expected `regressed`; the wrong version records `made_progress`'
  - area: baseline after a passing turn
    plausible_wrong_version: A passing turn leaves the old set on disk, so a later failure is compared with a set from before the pass
    discriminating_check: '{AC1, AC2}, then all pass, then {AC1}: expected `unchanged` (no baseline); the wrong version records `made_progress`'
  - area: set identity
    plausible_wrong_version: The lists are compared in the order the checks report them, or with duplicates, so the same failures in another order count as a change
    discriminating_check: 'the same two failures reported in either order: expected `unchanged`'
  - area: recorded delta
    plausible_wrong_version: The computed delta drives the stuck counter, but `last-verdict.json` still records the literal `unchanged`
    discriminating_check: 'goal with a run, {AC1, AC2} then {AC2}: `last-verdict.json` has delta `made_progress`'
