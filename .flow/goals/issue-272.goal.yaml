    type: github_issue
    number: 272
    title: 'fix(flow): evaluator-loop marks a goal failed as stuck while its failing criteria are being fixed one per turn'
  acceptance_criteria:
  - id: AC1
    text: A goal with two failing criteria, where one is fixed on each of the next two turns, is not marked failed with `failAfterStuckTurns=2`.
    verification_command: FLOW_E2E_SCENARIOS=goal-fixed-one-per-turn plugins/flow/tests/run.sh e2e-goal-stuck.test.sh
    must_pass: true
    status: pending
    evidence_ref: null
    last_evaluated_at: null
    last_result: null
  - id: AC2
    text: A goal whose failing criteria are identical for `failAfterStuckTurns` turns is still marked failed.
    verification_command: FLOW_E2E_SCENARIOS=goal-same-failures,goal-stuck plugins/flow/tests/run.sh e2e-goal-stuck.test.sh
    must_pass: true
    status: pending
    evidence_ref: null
    last_evaluated_at: null
    last_result: null
  - id: AC3
    text: A turn that adds a newly failing criterion is recorded as regressed.
    verification_command: FLOW_E2E_SCENARIOS=goal-regressed,goal-swapped-failure plugins/flow/tests/run.sh e2e-goal-stuck.test.sh
    must_pass: true
    status: pending
