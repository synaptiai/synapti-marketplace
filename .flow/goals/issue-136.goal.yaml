specification:
  non_goals:
  - 'Scanner execution (osv-scanner, pyscn, or any other tool) — entirely out of scope;
    that''s issue #137. This issue ingests only pre-existing scan output already present
    in the target project, via the Read tool.'
  - Regulatory-compliance checklists (SOC2/GDPR/ISO27001) — dropped from the whole
    4-part initiative, not deferred to this issue.
  - Any change to G01–G18's existing logic, order, or the FAIL > INCONCLUSIVE > PASS
    precedence computation in dossier-gate.sh — G19 is purely additive.
  - Any new package-level table in the 23 canonical documents — fill-instruction changes
    only to existing tables, reusing the existing Risk register / Accepted risks tables
    in decisions-technical-debt-and-risks.md.
  - Reusing G03/findings.md for vulnerability findings — architecturally wrong per
    finding-schema.md's explicit project-defect-out-of-scope rule.
  - 'Rotation/telemetry (issue #138) — untouched.'
  - Widening engagement.allowedActions — no new action class; ingestion is Read-tool
    only, no network access.
  - Exploit-chain detail or affected-version specifics beyond package+version+severity.
  failure_modes:
  - 'Timeouts: none — no network calls or long-running scans (Read-tool only).'
  - 'Partial failures: a scan artifact that parses partially must record what parsed
    and flag the unparsed portion in the evidence ledger''s Unavailable evidence section
    — never silently drop it.'
  - 'Invalid input: a scan-artifact parse failure must produce an explicit could-not-parse
    signal that flows to G19 as INCONCLUSIVE, never zero-findings-therefore-clean
    — mirrors the ERR-3 fix pattern shipped in dossier-policy.sh/dossier-evidence.sh.'
  - 'Missing context: (a) no scan artifact at all — G19 reports INCONCLUSIVE, never
    PASS; (b) calendar-invalid/rollover target/review dates must be rejected via validate_calendar_date(),
    not silently normalized; (c) a scan artifact read from repository content is untrusted
    input — documented constraint for any future CI-facing consumer, this issue''s
    scope is drafting-time only.'
  interface_contracts:
  - dossier-gate.sh gains a G19 mechanical condition using the existing record <id>
    mechanical <PASS|FAIL|INCONCLUSIVE> script pattern; JUDGMENT_IDS unchanged.
  - '00-control/evidence-ledger.md: vulnerability findings are ordinary EV-#### rows
    in the existing Evidence table — no schema change; one row per material (Critical/High)
    finding.'
  - '04-operating/decisions-technical-debt-and-risks.md: disposition uses the existing
    Risk register (Category=dependency|security) and Accepted risks table, unmodified
    schema.'
  - 'New ingestion entry point (name TBD in PLAN, e.g. dossier-vuln-evidence.sh):
    reads a scan artifact, detects format (SARIF/osv-scanner JSON/Dependabot export),
    emits normalized evidence rows. Read-tool-only.'
  - '05-due-diligence/assets-dependencies-and-licenses.md and 03-assurance/*.md: fill-instruction
    updates only, zero column/table changes.'
  - 'release-gate-conditions.md gains a ### G19 section in the existing prose contract
    shape.'
