            ## Summary


            Closes #116. Makes the flow plugin's `block-destructive.sh` force-branch-delete rule **merge-aware** instead
            of a blanket block.


            **Problem:** the hook blocked every force branch-delete and told the user to use safe-delete instead — but
            this repo squash-merges PRs, and safe-delete refuses to remove squash-merged branches (git doesn't see their
            commits on the default branch). So force-delete was the only option, and it was blocked → merged branches
