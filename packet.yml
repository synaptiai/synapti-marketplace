            haystack into `grep -q`, which exits at the first match and closes the pipe — killing `printf` with SIGPIPE
            (141); under the CI runner's `set -o pipefail` the pipeline then reported non-zero despite a successful
            match, causing nondeterministic false failures on large haystacks (it surfaced here as a spurious
            `start-v3-integration` failure on Linux CI, never on macOS). Switched to a here-string so there is no
            pipeline. Pre-existing, suite-wide, and independent of the hook change — bundled because it was blocking
            this PR's CI. Verified: the CI `test` job, previously red on the race, is now green.


