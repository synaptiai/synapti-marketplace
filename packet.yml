            Force-delete is now allowed **only when every target branch is provably merged into the default branch**,
            and blocked otherwise (and on any uncertainty — fail-safe):


            - **Merge detection:** `git merge-base --is-ancestor` for regular/fast-forward merges; a synthetic-commit +
            `git cherry` patch-equivalence check for squash merges (the branch's *combined* tree change vs the default).
            Checked against the local default **

