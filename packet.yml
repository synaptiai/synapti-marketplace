      # Document Headers


      Reference document. The canonical header block that opens every file in the dossier package, in two variants:
      `internal-v1` for the 21 internal documents and `public-v1` for the 2 documents under `06-public/`.
      `bin/dossier-package-check.sh` parses these headers; `templates/header-internal.md` and
      `templates/header-public.md` are the literal blocks a drafter copies.


      ## Form: YAML frontmatter


      Headers are **YAML frontmatter** — a `---` fence, `key: value` lines, a closing `---` fence, as the first bytes of
      the file. There is exactly one representation of every field. No parallel rendered table, no HTML comment twin.


      Why frontmatter and not a rendered table plus a machine-readable comment:


      | Consideration | Outcome |

      |---|---|

      | Drift | A rendered table duplicating a comment block means every header edit is two edits. Cross-document
      duplication that invites drift is one of the failure modes the verification passes hunt for; the package should
      not seed it in its own headers. |

      | House precedent | Skills, agents, and the flow decision journal already carry YAML frontmatter in Markdown. A
      reader of this repo knows the shape. |

      | Rendering | GitHub renders frontmatt
    stderr_summary: ''
