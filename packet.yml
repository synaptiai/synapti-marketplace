            ## 3.1.2 (2026-05-26)


            ### Fixed: `${ARGUMENTS%% *}` in command `!`-blocks expanded to empty (#121)


            Claude Code's slash-command preprocessor substitutes only the bare `$ARGUMENTS` and `${ARGUMENTS}` tokens —
