            # Configuration Resolution


            How every dossier command, script, and skill finds its settings. Read this before adding a config key or
            debugging a "why did it use that value" question.


            ## Precedence chain


            Six layers, highest first. The first layer that produces a non-empty, non-`null` value wins.


            | # | Layer | Path | Committed? | Purpose |

            |---|-------|------|-----------|---------|

            | 0 | Environment | `DOSSIER_<UPPER_SNAKE>` | n/a | **What makes a CI job zero-interaction.** Overrides
            everything. |

            | 1 | Explicit file | `$DOSSIER_CONFIG` | n/a | A named config for one-off runs against a project you do not
            own. |

            | 2 | Project-local | `.claude/settings.dossier.local.json` | No — gitignored | Personal overrides. Never
            shared. |

            | 3 | Project-shared | `.claude/settings.dossier.json` | Yes | The team's answer. What `/dossier:setup`
            writes. |

            | 4 | User-global | `$HOME/.claude/settings.dossier.json` | n/a | Your defaults across every project. |

            | 5 | Plugin default | `${CLAUDE_PLUGIN_ROOT}/

            ... [elided 6271 chars] ...

            hich would skip four layers of the cascade.

            5. If `/dossier:setup` should write it, add it to the setup merge and to `templates/config.example.json`.
          elided: true
