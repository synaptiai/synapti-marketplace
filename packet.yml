            ## Why `// null` and not `// empty`


            Callers resolve keys as `.dossier.ci.enabled // null`, not `// empty`. `// empty` swallows `false` alongside
            `null`, so an explicitly disabled feature would fall through to the next layer and silently re-enable
            itself. `cascade-resolve.sh` treats the literal string `null` as not-found but prints `false` as a real
            resolved value, which is the behaviour that makes an explicit `false` in a project file actually stick.
          elided: false
        - kind: after
          text: >-
            ## Why the resolver passes a bare jq path


            `bin/dossier-resolve-config.sh` resolves `.dossier.ci.enabled` — with **no** `//` alternative operator
            appended. This is deliberate and easy to "fix" wrongly.


            jq's `//` is **falsy**-triggered, not null-triggered:


            ```bash

            $ echo '{"a":false}' | jq -r '.a // null'

            null              # WRONG — an explicit false reports as not-found

            $ echo '{"a":false}' | jq -r '.a // empty'
                              # WRONG — same defect, now indistinguishable from absent
            $ echo '{"a":false}' | jq -r '.a'

            false             # correct

            $ echo '{}' | jq -r '.a'

            null              # correct — cascade-resolve.sh treats "null" as not-found

            ```


            With either alternative operator, a feature a user explicitly disabled in a project file resolves as
            not-found, the cascade falls through to the next layer, and the plugin silently re-enables it. The bare path
            distinguishes "set to false" from "not set" correctly, because `cascade-resolve.sh` already treats the
            literal string `null` as not-found and prints `false` as a real value.


            Do not add `// null` or `// empty` to a cascade lookup.
