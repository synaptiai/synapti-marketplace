      # Dossier CI Automation — Implementation Plan


      ## 0. Architecture decisions that everything else follows from


      Four decisions drive the whole design. Each one exists because the obvious alternative breaks under adversarial
      conditions.


      **D1 — Range-based refresh, not PR-based.** The agent documents `cursor..HEAD`, where `cursor` is a durable
      watermark, *not* the triggering PR's diff. The PR is supplementary evidence (intent, labels, discussion), never
