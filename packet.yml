            1034 assertions had never caught any of them, because each is a disagreement between two artifacts that no
            single test compared: a gate against its template, a linter against its reference, a scanner against a
            document's header, a normalization applied to one side of a comparison, a rule that mandates text another
            rule forbids, a test asserting a constant instead of a pair, a scaffold that built a package with no way
            into it, and a diagram check that graded what was drawn and never asked what was skipped. Each now has a
