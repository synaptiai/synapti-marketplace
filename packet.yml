            a gate against its template, a linter against its reference, a scanner against a document's header, a
            normalization applied to one side of a comparison, a rule that mandates text another rule forbids, and a
            test asserting a constant instead of a pair. Each now has a regression test that fails if the pair drifts
            again — 1055 assertions, up from 1076.
