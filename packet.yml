            # Disclosure Policy Levels


            Governs everything under `06-public/`. Read this before writing a single externally-visible sentence.


            A public document is an unretractable commitment. A wrong internal document is corrected in the next
            revision; a wrong public claim has already been read, quoted, screenshotted, and relied upon. Every default
            here is therefore the conservative one.


            ## The five policy values


            Set at `dossier.disclosure.policy`. The value classifies material that is not otherwise classified — it is
            the floor, not a ceiling.


