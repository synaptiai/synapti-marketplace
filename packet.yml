      # Universal project documentation system


      This package contains:


      1. A master prompt that turns a capable LLM or coding agent into the acting CTO, lead principal engineer, product
      documentation architect, and technical due-diligence lead for a project.

      2. A separate verification prompt intended to be run in a fresh context, ideally with a different model or an
      independent human reviewer supervising it.

      3. A compact invocation template for each new project.


      The system is designed for software, data, AI/ML, infrastructure, hardware-connected, and mixed projects. It
      creates a stable documentation set serving three purposes:


      - technical and product due diligence;

      - engineering and product onboarding;

      - public communication for technical partners and customers or consumers.


      It is intentionally evidence-first. Its job is not to make the project look complete. Its job is to make the truth
      about the project clear, navigable, useful, and safe to disclose.


