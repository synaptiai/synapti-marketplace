      excerpts:
        - kind: after
          text: >
            # Project Type Adaptation


            How the fixed 23-file package adapts to what the project actually is.


            ## The rule


            **Content adapts. Structure never.**


            Every project gets all 7 directories and all 23 files. A library still has
            `infrastructure-and-deployment.md`; a project with no AI still has `data-and-ai.md`. What changes is which
            sections carry substance and which carry a justified `N/A`.


            This is not bureaucracy. A package whose shape varies per project cannot be diffed across revisions,
            compared across engagements, or audited against a checklist — and "we dropped that file because it did not
            apply" is indistinguishable from "we ran out of time" six months later. An `N/A` with evidence is a finding;
            a missing file is a hole.


            ## Classifying the project


            `dossier.project.type` defaults to `auto`. Classification happens in Phase 1 from evidence, and the
            classification itself is recorded with its supporting evidence IDs — it drives what gets emphasized, so a
            wrong classification produces 

            ... [elided 6779 chars] ...

            tate handling and marks the AI sections `N/A` with evidence. The reader always knows where to look, and the
            absence of content is itself informative.
